[package]
name = "sensevoice-small-wgpu"
version = "0.1.0"
edition = "2021"
description = "SenseVoiceSmall speech recognition on Rust CPU + wgpu"
license = "MIT"
publish = false

[[bin]]
name = "sensevoice"
path = "src/bin/sensevoice.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
hound = "3"
gemm = "0.18"
# Same version `gemm` itself links against, so this resolves to the one crate
# instance and therefore the one `CACHE_INFO` lazy table (see
# `encoder_cpu::freeze_gemm_tiling`).
gemm-common = "0.18"
pollster = "0.4"
rayon = "1.10"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac"] }
wgpu = "30.0.1"
zip = "2"

[profile.release]
lto = "thin"
